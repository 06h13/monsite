<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tahzio · Radio France - 06h13</title>
<meta name="description" content="Toutes les vidéos TikTok de Tahzio pour Radio France, montées par 06h13.">
<link rel="icon" href="../favicon.png" type="image/png">
<link rel="apple-touch-icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Même identité que la page d'accueil : nuit, rouge 06h13, Space Grotesk + Inter. */
:root{
  --bg:#060607; --bg2:#0A0808; --panel:#111012; --panel2:#171416; --fg:#F2EDED; --muted:#9A8A8C; --dim:#5C4E50;
  --line:#2A1F21; --line2:#3C2224; --accent:#E8222F; --accent2:#FF4D4D; --ok:#E8222F;
  color-scheme: dark;
}
*{box-sizing:border-box; min-width:0}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--fg); font-family:'Inter',system-ui,sans-serif; line-height:1.5}
.mono{font-family:'JetBrains Mono','Space Grotesk',monospace; font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer; text-align:left; -webkit-appearance:none; appearance:none; width:auto}
h1,h2{font-family:'Space Grotesk',sans-serif; margin:0}

#app{display:flex; min-height:100dvh}

/* ---------- Barre latérale (identique au site) ---------- */
.sidebar{
  width:248px; min-width:248px; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:18px 14px;
  padding-top:max(18px, env(safe-area-inset-top,0px)); padding-left:max(14px, env(safe-area-inset-left,0px));
}
.logo{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:1.15rem; margin:4px 4px 18px; text-decoration:none; display:block}
.logo b{color:var(--accent)}

.profile{
  display:flex; align-items:center; gap:8px; padding:5px 8px; border-radius:12px; background:var(--panel2);
  border:1px solid var(--line); margin-bottom:6px;
}
.avatar{width:34px; height:34px; border-radius:50%; flex:none; overflow:hidden; background:transparent}
.avatar img{width:100%; height:100%; object-fit:cover; display:block}
.profile .who{min-width:0}
.profile .name{font-weight:600; font-size:.92rem; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.profile .handle{color:var(--dim); font-size:.76rem; line-height:1.15}

.plan{display:flex; align-items:center; gap:6px; font-size:.74rem; color:var(--accent2); margin:2px 2px 16px}
.plan .dot{width:6px; height:6px; border-radius:50%; background:var(--ok)}

nav.navgroup{margin-bottom:18px}
.navlabel{font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--dim); margin:0 8px 6px}
.navitem{
  display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; font-size:.86rem;
  color:var(--muted); text-decoration:none; margin-bottom:2px;
}
.navitem svg{width:17px; height:17px; flex:none}
.navitem.active{background:rgba(232,34,47,.14); color:var(--accent)}
.navitem.active svg{stroke:var(--accent)}
.navitem:not(.active):hover{color:var(--fg)}

/* ---------- Topbar mobile ---------- */
.topbar{display:none; align-items:center; gap:12px; height:52px; padding:0 14px; background:var(--panel); border-bottom:1px solid var(--line)}
.topbar .logo{margin:0}
.burger{margin-left:auto; width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:9px; background:var(--panel2)}
.burger svg{width:18px; height:18px}
.scrim-overlay{display:none; position:fixed; inset:0; background:rgba(5,6,10,.6); z-index:40}

/* ---------- Contenu principal ---------- */
.main{flex:1; min-width:0; overflow-x:hidden}
.main-inner{margin:0; padding:26px 32px 60px}

@media(max-width:860px){
  .sidebar{display:none}
  .topbar{display:flex}
  #app{flex-direction:column}
  .sidebar.open{
    display:flex; position:fixed; inset:0 auto 0 0; z-index:50; height:100dvh; width:76vw; max-width:300px;
    box-shadow:20px 0 40px rgba(0,0,0,.4);
  }
  .scrim-overlay.open{display:block}
}
@media(max-width:520px){
  .main-inner{padding:18px 16px 46px}
}

.wrap{max-width:1180px; margin:0 auto}

.grille{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:16px}
.vid{text-decoration:none; display:block}
.vid .thumb{aspect-ratio:9/16; border-radius:12px; overflow:hidden; position:relative; background:linear-gradient(155deg,#1E0C0E,#0A0808); border:1px solid var(--line)}
.vid .thumb img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.vid .scrim{position:absolute; inset:0; background:linear-gradient(180deg, rgba(10,13,20,0) 62%, rgba(10,13,20,.75) 100%)}
.vid .vues{position:absolute; left:8px; bottom:7px; font-size:.72rem; font-weight:600; display:flex; align-items:center; gap:4px}
.vid .play{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:38px; height:38px; border-radius:50%;
  border:1.5px solid rgba(242,241,237,.4); display:flex; align-items:center; justify-content:center; background:rgba(10,13,20,.4);
  font-size:.72rem; opacity:0; transition:opacity .15s}
.vid:hover .thumb, .vid:focus-visible .thumb{border-color:var(--accent)}
.vid:hover .play, .vid:focus-visible .play{opacity:1; border-color:var(--accent); color:var(--accent)}
.vid:focus-visible{outline:none}
.cap{padding:8px 2px 0}
.cap .nom{font-size:.84rem; font-weight:600; margin:0 0 2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere}
.cap .meta{font-size:.72rem; color:var(--dim); margin:0}
.plus{display:flex; margin:28px auto 0; padding:11px 22px; border-radius:99px; background:var(--panel); border:1px solid var(--line2); font-size:.88rem; font-weight:600}
.plus:hover{border-color:var(--accent)}
.foot{color:var(--dim); font-size:.74rem; margin-top:40px}

@media(max-width:600px){
  .grille{grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
}
@media(prefers-reduced-motion:reduce){ .vid .play{transition:none} }
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="../">06h<b>13</b></a>
  <button class="burger" id="burgerBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
</div>
<div class="scrim-overlay" id="scrim"></div>

<div id="app">

  <aside class="sidebar" id="sidebar">
    <a class="logo" href="../">06h<b>13</b></a>

    <div class="profile">
      <div class="avatar"><img src="../favicon.png" alt=""></div>
      <div class="who">
        <p class="name">06h13</p>
        <p class="handle">@SixHeuresTreize</p>
      </div>
    </div>
    <div class="plan"><span class="dot"></span> Disponible</div>

    <nav class="navgroup">
      <a class="navitem" href="../#projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="8" height="8" rx="1.5"/><rect x="13" y="4" width="8" height="8" rx="1.5"/><rect x="3" y="14" width="8" height="6" rx="1.5"/><rect x="13" y="14" width="8" height="6" rx="1.5"/></svg>
        Mes projets
      </a>
      <a class="navitem" href="../#reseaux">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.6M8.2 13.2l7.6 4.6"/></svg>
        Réseaux
      </a>
    </nav>

    <nav class="navgroup">
      <p class="navlabel">Créer</p>
      <a class="navitem" href="../#reseaux">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 5v14M5 12h14"/></svg>
        Nouveau projet
      </a>
    </nav>

    <nav class="navgroup">
      <p class="navlabel">Gestion</p>
      <a class="navitem active" href="./">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="7" y="2" width="10" height="20" rx="2"/></svg>
        Shorts
      </a>
      <a class="navitem" href="../#projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>
        Formats longs
      </a>
    </nav>
  </aside>

  <main class="main">
    <div class="main-inner">
      <div class="wrap">
        <div class="grille" id="grille"></div>
        <button class="plus" id="plus" hidden>Voir plus</button>

        <p class="foot">06h13, monteur freelance mercenaire.</p>
      </div>
    </div>
  </main>
</div>

<script>
{
  var sidebar = document.getElementById('sidebar');
  var scrim = document.getElementById('scrim');
  var burger = document.getElementById('burgerBtn');
  function toggleSidebar(open){ sidebar.classList.toggle('open', open); scrim.classList.toggle('open', open); }
  burger.addEventListener('click', function(){ toggleSidebar(!sidebar.classList.contains('open')); });
  scrim.addEventListener('click', function(){ toggleSidebar(false); });

  const PAGE = 48;
  const MOIS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const vues = (n) => n >= 1e6 ? (n / 1e6).toFixed(1).replace('.', ',') + ' M'
    : n >= 1000 ? (n / 1000).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, '').replace('.', ',') + ' k' : String(n);
  const date = (d) => { const [a, m, j] = d.split('-'); return `${+j} ${MOIS[+m - 1]} ${a}`; };
  let videos = [];
  let n = PAGE;

  function rendre() {
    const vis = videos.slice(0, n);
    $('grille').innerHTML = vis.length ? vis.map((v) => `
      <a class="vid" href="https://www.tiktok.com/@tahzioradiofrance/video/${v.id}" target="_blank" rel="noopener">
        <div class="thumb">
          <img src="v/${v.id}.webp" alt="" loading="lazy" decoding="async" width="144" height="256">
          <div class="scrim"></div>
          <span class="vues mono">▶ ${vues(v.v)}</span>
          <span class="play" aria-hidden="true">▶</span>
        </div>
        <div class="cap">
          <p class="nom">${esc(v.t)}</p>
          <p class="meta mono">${date(v.d)}</p>
        </div>
      </a>`).join('') : '';
    $('plus').hidden = videos.length <= n;
    $('plus').textContent = `Voir plus (${videos.length - n} restantes)`;
  }

  $('plus').addEventListener('click', () => { n += PAGE; rendre(); });

  fetch('videos.json').then((r) => r.json()).then((d) => {
    videos = d;
    rendre();
  });
}
</script>
</body>
</html>
